[package]
name = "windows-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Service-only TPM-backed Windows CNG PC identity key adapter"

[features]
# Disposable CI lab hosts have no TPM (probe run 34591263436 returned
# NTE_DEVICE_NOT_READY from the Platform Crypto Provider). This compile-time
# feature selects the Microsoft Software Key Storage Provider so the whole
# service can run in that lab. It is never a runtime fallback; release
# packaging rejects binaries that embed the lab profile marker (ADR 0027).
lab-software-identity = []

[dependencies]
p256.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
] }

# Mirrors windows-observer: only the private Windows FFI module may override
# deny(unsafe_code). Shared codecs and all public caller logic remain safe.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
