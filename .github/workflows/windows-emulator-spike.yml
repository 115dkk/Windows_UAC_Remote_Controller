name: Windows lab emulator spike

# Measurement, not a gate. The UAC lab pairs the real Windows side against a
# synthetic phone fixture, and both crashes that reached real hardware lived on
# the phone side, where no CI job goes. Putting a real Android emulator on the
# lab's own runner would close that, and the runner probe already showed WHPX
# installed and usable there. What it did not show is whether an emulator
# actually boots on that runner, how long it costs, and whether the guest can
# reach a listener on the host, which is where the relay lives.
#
# This job answers those three and nothing else. It installs a system image and
# creates a disposable AVD on a throwaway runner. It touches no product code, no
# service, no policy and no UAC surface.

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/native-runtime']
    paths: ['.github/workflows/windows-emulator-spike.yml']

permissions:
  contents: read

concurrency:
  group: windows-emulator-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    name: Can the lab runner boot an accelerated emulator
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Report the starting facts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $sdk = $env:ANDROID_HOME; if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          Write-Output "sdk=$sdk"
          "ANDROID_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$sdk\emulator\emulator.exe" -accel-check 2>&1 | ForEach-Object { $_ }
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize, FreePhysicalMemory | Format-List | Out-String
          exit 0
      - name: Install the system image the product's own emulator job uses
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $started = Get-Date
          $sdkmanager = "$env:ANDROID_SDK\cmdline-tools\latest\bin\sdkmanager.bat"
          # The image must match the lifecycle job, or a later phase would be
          # measuring a different Android than the product is already tested on.
          $image = 'system-images;android-36;google_apis;x86_64'
          'y' * 20 -split '' | Out-Null
          $yes = (1..30 | ForEach-Object { 'y' }) -join "`n"
          $yes | & $sdkmanager --licenses 2>&1 | Select-Object -Last 3
          & $sdkmanager --install $image 'platform-tools' 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed: $LASTEXITCODE" }
          Write-Output ("image install took {0:n1} minutes" -f ((Get-Date) - $started).TotalMinutes)
      - name: Create a disposable AVD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $avdmanager = "$env:ANDROID_SDK\cmdline-tools\latest\bin\avdmanager.bat"
          'no' | & $avdmanager create avd --force --name uac-lab-spike --package 'system-images;android-36;google_apis;x86_64' --device pixel_6
          if ($LASTEXITCODE -ne 0) { throw "avdmanager failed: $LASTEXITCODE" }
          Get-ChildItem "$env:USERPROFILE\.android\avd" | Select-Object -ExpandProperty Name
      - name: Boot it headless on WHPX and time the boot
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Continue'
          $started = Get-Date
          $emulator = "$env:ANDROID_SDK\emulator\emulator.exe"
          $adb = "$env:ANDROID_SDK\platform-tools\adb.exe"
          # A QR has to reach the camera eventually, and the virtual scene is the
          # only way in without touching the app. Whether the flag is accepted is
          # worth knowing now; whether the app can read the poster is a question
          # only the app can answer, in a later phase.
          $poster = Join-Path $env:RUNNER_TEMP 'wall.png'
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 512, 512
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::White)
          $graphics.FillRectangle([System.Drawing.Brushes]::Black, 64, 64, 384, 384)
          $graphics.Dispose(); $bitmap.Save($poster); $bitmap.Dispose()
          $arguments = @('-avd','uac-lab-spike','-no-window','-no-snapshot','-noaudio','-no-boot-anim',
            '-gpu','swiftshader_indirect','-accel','on','-camera-back','virtualscene',
            '-virtualscene-poster',"wall=$poster",'-port','5554')
          Write-Output "emulator $($arguments -join ' ')"
          $log = Join-Path $env:RUNNER_TEMP 'emulator.log'
          $process = Start-Process -FilePath $emulator -ArgumentList $arguments -PassThru -NoNewWindow `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          & $adb start-server | Out-Null
          $booted = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 10
            $state = (& $adb -s emulator-5554 shell getprop sys.boot_completed 2>&1) -join ''
            if ($state -match '1') { $booted = $true; break }
            if ($process.HasExited) { Write-Output "emulator exited early: $($process.ExitCode)"; break }
          }
          Write-Output ("boot wait took {0:n1} minutes, booted={1}" -f ((Get-Date) - $started).TotalMinutes, $booted)
          Write-Output '--- emulator stdout (tail) ---'
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          Write-Output '--- emulator stderr (tail) ---'
          if (Test-Path "$log.err") { Get-Content "$log.err" -Tail 30 }
          if (-not $booted) { throw 'The lab runner did not boot an emulator; the fixture cannot be replaced there.' }
          & $adb -s emulator-5554 shell getprop ro.build.version.sdk
          & $adb -s emulator-5554 shell getprop ro.product.cpu.abi
      - name: Can the guest reach a listener on the host, where the relay lives
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          $adb = "$env:ANDROID_SDK\platform-tools\adb.exe"
          # The lab binds its relay to the runner's own address and refuses one
          # that is not this runner's, so the guest has to reach that address
          # rather than the 10.0.2.2 loopback alias. Prove it with a listener the
          # spike owns: it speaks one fixed word and holds no secret.
          $socket = [Net.Sockets.UdpClient]::new()
          try { $socket.Connect('192.0.2.1', 9); $ip = $socket.Client.LocalEndPoint.Address.ToString() } finally { $socket.Dispose() }
          Write-Output "host address=$ip"
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Parse($ip), 17443)
          $listener.Start()
          New-NetFirewallRule -DisplayName 'uac-emulator-spike' -Direction Inbound -Action Allow `
            -Protocol TCP -LocalPort 17443 -ErrorAction SilentlyContinue | Out-Null
          $accept = $listener.BeginAcceptTcpClient($null, $null)
          Write-Output '--- guest side: toybox nc ---'
          & $adb -s emulator-5554 shell "echo hello | toybox nc -w 5 $ip 17443" 2>&1 | ForEach-Object { $_ }
          Write-Output "nc exit=$LASTEXITCODE"
          $reached = $accept.AsyncWaitHandle.WaitOne(15000)
          Write-Output "host observed a guest connection: $reached"
          if ($reached) { $listener.EndAcceptTcpClient($accept).Close() }
          $listener.Stop()
          Remove-NetFirewallRule -DisplayName 'uac-emulator-spike' -ErrorAction SilentlyContinue
          Write-Output '--- also record what 10.0.2.2 does, for comparison ---'
          & $adb -s emulator-5554 shell "toybox nc -w 3 10.0.2.2 17443; echo alias_exit=$?" 2>&1 | ForEach-Object { $_ }
          exit 0
      - name: Stop the disposable emulator
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:ANDROID_SDK\platform-tools\adb.exe" -s emulator-5554 emu kill 2>&1 | ForEach-Object { $_ }
          exit 0
