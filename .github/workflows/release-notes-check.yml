name: Release notes contracts

on:
  pull_request:
    paths: ['tools/release-notes*', 'docs/RELEASE_NOTES_TEMPLATE.md', 'docs/release-verification.md', '.github/workflows/release.yml', '.github/workflows/release-notes-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: node --test tools/release-notes.test.mjs
