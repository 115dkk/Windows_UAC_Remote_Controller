name: Android real-product lifecycle

on:
  pull_request:
  push:
    branches: [main, 'codex/native-runtime']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Product JNI lifecycle (API36 x86_64, unlocked emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: 'true'
      ORG_GRADLE_PROJECT_controllerAbi: x86_64
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Set up repository-pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0, Node 24
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked client/build dependencies
        run: npm ci
      - name: Test host guards and exact ABI selection (no device)
        run: node --test tools/android-lifecycle-ci.test.mjs tools/android-pairing-scan-ci.test.mjs tools/android-abi.test.mjs tools/android-core-check.test.mjs tools/build-android-bindings.test.mjs tools/verify-android-apk.test.mjs tools/verify-android-boot-manifest.test.mjs
      - name: Record source inputs before any APK build
        run: node tools/android-lifecycle-ci.mjs --prepare
      - name: Install pinned Android build inputs
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' --channel=0 </dev/null
          echo "NDK_HOME=$sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup show active-toolchain
          rustup target add x86_64-linux-android
      - name: Build genuine x86_64 Tauri and controller product APK
        run: npm run tauri -- android build --debug --target x86_64 --apk --ci
      - name: Reject unsupported and mismatched actual Gradle ABI configurations
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { runProver } from './tools/prover-process.mjs';
          const directory = 'target/android-lifecycle-ci/gradle-negative';
          mkdirSync(directory, { recursive: true });
          const cancellation = new AbortController();
          for (const signal of ['SIGINT', 'SIGTERM']) process.once(signal, () => cancellation.abort());
          const cases = [
            ['unsupported', ['-PcontrollerAbi=not-supported'], 'Select exactly one supported controller ABI: arm64-v8a or x86_64.'],
            ['mismatch', ['-PcontrollerAbi=arm64-v8a', '-PabiList=arm64-v8a', '-ParchList=x86_64', '-PtargetList=aarch64'], 'controllerAbi and Tauri abiList/archList/targetList must describe the same single Android ABI.'],
          ];
          for (const [name, properties, required] of cases) {
            const args = ['src-tauri/gen/android/gradlew', '-p', 'src-tauri/gen/android', ':app:tasks', '--no-daemon', ...properties];
            const value = await runProver('/usr/bin/bash', args, { cwd: process.cwd(), logPath: `${directory}/${name}.log`,
              timeoutMs: 240000, maxOutputBytes: 4 * 1024 * 1024, signal: cancellation.signal });
            const passed = !value.error && !value.cancelled && !value.cleanupIncomplete && value.status !== null && value.status !== 0 &&
              `${value.stdout}\n${value.stderr}`.includes(required);
            writeFileSync(`${directory}/${name}.json`, JSON.stringify({ args, expectedError: required, status: value.status,
              failedProcess: Boolean(value.error), cancelled: value.cancelled, cleanupIncomplete: value.cleanupIncomplete, passed }, null, 2), { flag: 'wx' });
            if (!passed) throw new Error(`Gradle ${name} did not fail with the exact ABI selector error.`);
          }
          NODE
      - name: Build instrumentation against that real product flavor
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { lstatSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { resolve, join } from 'node:path';
          import { inspectApk } from './tools/verify-android-apk.mjs';
          import { runProver } from './tools/prover-process.mjs';
          const root = process.cwd(), output = resolve(root, 'src-tauri/gen/android/app/build/outputs/apk');
          const candidates = []; let entries = 0;
          function walk(path, depth = 0) {
            if (depth > 8) throw new Error('Excess APK tree depth');
            for (const item of readdirSync(path, { withFileTypes: true })) {
              if (++entries > 512 || item.isSymbolicLink()) throw new Error('Unexpected APK output tree');
              const child = join(path, item.name);
              if (item.isDirectory()) walk(child, depth + 1);
              else if (item.isFile() && item.name.endsWith('.apk')) candidates.push(child);
            }
          }
          walk(output);
          if (candidates.length !== 1) throw new Error('One genuine prebuilt product APK required');
          const apk = candidates[0], before = await inspectApk(apk, 'x86_64');
          const library = resolve(root, 'target/x86_64-linux-android/debug/libcontroller_app_lib.so');
          function hash(path) {
            const stat = lstatSync(path);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size < 1 || stat.size > 512 * 1024 * 1024) throw new Error('Unexpected prebuilt input');
            return createHash('sha256').update(readFileSync(path)).digest('hex');
          }
          const libraryHash = hash(library);
          if (before.libraries.find(item => item.member === 'lib/x86_64/libcontroller_app_lib.so')?.sha256 !== libraryHash) throw new Error('Tauri library differs from the actual built APK');
          // The preceding mandatory Tauri CLI step already built this exact library.
          // Only its redundant callback task needs the now-closed CLI WebSocket.
          const args = ['src-tauri/gen/android/gradlew', '-p', 'src-tauri/gen/android', ':app:assembleUniversalDebugAndroidTest',
            '-PabiList=x86_64', '-ParchList=x86_64', '-PtargetList=x86_64', '--no-daemon', '-x', ':app:rustBuildX86_64Debug'];
          const cancellation = new AbortController();
          for (const signal of ['SIGINT', 'SIGTERM']) process.once(signal, () => cancellation.abort());
          const result = await runProver('/usr/bin/bash', args, { cwd: root, logPath: 'target/android-lifecycle-ci/instrumentation-build.log',
            timeoutMs: 600000, maxOutputBytes: 4 * 1024 * 1024, signal: cancellation.signal });
          if (result.error || result.signal || result.status !== 0 || result.cancelled || result.cleanupIncomplete || cancellation.signal.aborted) throw new Error('Actual instrumentation build failed');
          if (hash(apk) !== before.apk.sha256 || hash(library) !== libraryHash) throw new Error('Previously built product changed during instrumentation build');
          writeFileSync('target/android-lifecycle-ci/instrumentation-prebuilt-binding.json', JSON.stringify({
            commit: process.env.GITHUB_SHA, productApkSha256: before.apk.sha256, tauriLibrarySha256: libraryHash,
            previouslyBuiltTask: ':app:rustBuildX86_64Debug', actualInstrumentationArguments: args, productUnchanged: true,
          }, null, 2), { flag: 'wx' });
          NODE
      - name: Allow disposable CI emulator acceleration
        run: sudo chmod 0666 /dev/kvm
      - name: Test actual foreground owner, reboot and package replacement
        id: lifecycle
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0, Node 24
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: uac-lifecycle-ci-36-x86_64
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back emulated
          # Preserve every original lifecycle/first-unlock check and its limits.
          # The separately bounded scanner step uses that same unlocked fixture.
          script: node tools/android-lifecycle-ci.mjs && node tools/android-pairing-scan-ci.mjs
      - name: Retain exact APKs and lifecycle evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: android-product-lifecycle-${{ github.sha }}
          path: |
            target/android-lifecycle-ci/
            src-tauri/gen/android/app/build/outputs/apk/
          if-no-files-found: error
          retention-days: 14
      - name: Retain native scanner checks and no-QR view renders separately
        if: ${{ always() && (steps.lifecycle.outcome == 'success' || hashFiles('target/android-pairing-scan-ci/**') != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: android-pairing-scan-${{ github.sha }}
          path: target/android-pairing-scan-ci/
          if-no-files-found: error
          retention-days: 14
