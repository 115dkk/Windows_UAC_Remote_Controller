name: Stored deny shaped-proof check-only experiment

on:
  workflow_dispatch:
  push:
    branches: ['codex/protocol-witness-shape']
    paths:
      - 'tools/protocol-witness-shape*'
      - 'security/tamarin/candidates/HonestApproveShapedProof.spthy'
      - 'security/tamarin/candidates/HonestDenyShapedProof.spthy'
      - '.github/workflows/protocol-witness-shape.yml'

permissions:
  contents: read

concurrency:
  group: protocol-witness-shape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  investigate:
    name: Stored deny be8a31b proof ${{ matrix.context }} (not a security gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: good
            argument: --check-deny-stored=good
          - context: sorry
            argument: --check-deny-stored=sorry
          - context: contradiction
            argument: --check-deny-stored=contradiction
    env:
      CI: 'true'
    steps:
      - name: Check out this exact experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node24
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install prover dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz unzip
      - name: Install the same pinned Tamarin and Maude
        id: tamarin
        run: node tools/install-tamarin.mjs
      - name: Check exact body-only controls and subprocess bounds
        run: node --test tools/protocol-witness-shape.test.mjs tools/prover-process.test.mjs
      - name: Replay this fixed stored-proof context without automatic proof search
        env:
          TAMARIN_BIN: ${{ steps.tamarin.outputs.binary }}
        run: node tools/protocol-witness-shape.mjs "${{ matrix.argument }}"
      - name: Retain original candidate and complete or failed transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node24
        with:
          name: protocol-deny-shape-check-${{ matrix.context }}-${{ github.sha }}
          path: artifacts/protocol-witness-shape/
          if-no-files-found: error
          retention-days: 14
