[package]
name = "windows-dns-sd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Windows DNS-SD announcements for local relay routing hints"

[dependencies]
thiserror.workspace = true

[dev-dependencies]
getrandom.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
    "Win32_System_SystemInformation",
] }

# Only the reviewed Windows-only src/ffi.rs may override this deny lint.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
