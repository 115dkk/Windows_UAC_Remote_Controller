name: Localization and bundled fonts
on:
  push:
    branches: [main, 'codex/native-runtime']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalogs-fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Validate all locale catalogs
        run: node --test tools/i18n-contract.test.mjs
      - name: Install pinned font inspection tools
        run: python -m pip install fonttools==4.63.0 brotli==1.2.0
      - name: Verify offline glyph coverage and native font provenance
        run: python tools/check-i18n-fonts.py
