# SPDX-License-Identifier: GPL-2.0-or-later
[graph]
all-features = true
exclude-dev = false
exclude-unpublished = false

[licenses]
include-dev = true
include-build = true
# GNU choices are explicit: original code stays GPL-2.0-or-later; the existing
# Apache-dependent combined-binary route permits GPLv3-compatible dependencies.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The policy also permits the user's selected GPL/LGPL families when not in use.
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[advisories]
# A security vulnerability is denied wherever it sits, however deep. That is the
# point of this check: rustls gates the phone channel and arrives four levels
# down, and this gate is what caught RUSTSEC-2026-0285 in it.
#
# Unmaintained crates are judged only where this workspace can act on them.
# Every unmaintained advisory currently in the tree comes from Tauri's own
# dependencies (gtk -> glib -> glib-macros -> proc-macro-error, and
# urlpattern -> unic-*), each carrying "no safe upgrade is available". Denying
# those would buy an ignore list that has to be re-proven every time Tauri
# moves, in exchange for no decision this project is able to make.
unmaintained = "workspace"
# A withdrawn release is always this workspace's problem, whoever pulled it in.
yanked = "deny"
# Unsound code is denied as deep as a vulnerability is. Exactly one exception
# stands, and only while it is unavoidable:
#
# RUSTSEC-2024-0429 (GHSA-wrw7-89jp-8q8g, glib < 0.20) arrives through Tauri's
# Linux backend: tauri, wry and tao -> gtk 0.18 -> glib 0.18. The newest wry
# still requires gtk 0.18, so no upgrade removes it. It is never compiled into
# the shipped Windows or Android builds, and nothing here calls the affected
# glib::VariantStrIter.
#
# tools/glib-upgrade-watch.mjs fails the Cargo Deny job as soon as the newest
# releases of those dependencies resolve without glib < 0.20, and
# unused-ignored-advisory fails it once Cargo.lock no longer holds that glib.
# Either way the entry below must go, and from then on glib < 0.20 is denied
# again like any other unsound crate.
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2024-0429", reason = "glib < 0.20 only via Tauri's Linux GTK backend; no upgrade exists yet; watched by tools/glib-upgrade-watch.mjs" },
]
