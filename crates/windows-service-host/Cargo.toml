[package]
name = "windows-service-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Fixed-identity Windows SCM lifecycle host with protected-installation validation"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
activity-journal = { path = "../activity-journal" }
windows-prompt-probe = { path = "../windows-prompt-probe" }
getrandom.workspace = true
approval-core = { path = "../approval-core" }
approval-protocol = { path = "../approval-protocol" }
android-attestation = { path = "../android-attestation" }
secure-channel = { path = "../secure-channel" }
service-protocol = { path = "../service-protocol" }
framed-transport = { path = "../framed-transport" }
tokio = { version = "=1.53.1", features = ["rt", "net", "sync", "time", "macros"] }
sha2.workspace = true
p256 = { workspace = true, features = ["pkcs8"] }

[dev-dependencies]
android-controller = { path = "../android-controller" }
notification-policy = { path = "../notification-policy" }
phone-request-core = { path = "../phone-request-core" }
phone-state-store = { path = "../phone-state-store" }
tempfile = "3.23.0"

[target.'cfg(windows)'.dependencies]
windows-identity = { path = "../windows-identity" }
windows-service = "0.8.1"
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# Reviewed Windows-only boundary: only private ffi/entry modules may override
# this deny lint. Shared crates retain the workspace-wide unsafe-code forbid.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
