name: Fixed attack witness experiments

on:
  workflow_dispatch:
  push:
    branches: ['codex/protocol-witness-shape']
    paths:
      - 'tools/protocol-attack-witness*'
      - 'security/tamarin/candidates/CurrentRequestAuthorization42b.spthy'
      - '.github/workflows/protocol-attack-witness.yml'

permissions:
  contents: read
concurrency:
  group: protocol-attack-witness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  investigate:
    name: ${{ matrix.variant }} attack witness / ${{ matrix.context }} (experiment only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: [signature, replay]
        context: [mutant, baseline]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node24
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install prover dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz unzip
      - id: tamarin
        run: node tools/install-tamarin.mjs
      - name: Test fixed source and attack shape
        run: node --test tools/protocol-attack-witness.test.mjs tools/prover-process.test.mjs
      - name: Search the exact mutated or original transition model
        env:
          TAMARIN_BIN: ${{ steps.tamarin.outputs.binary }}
        run: node tools/protocol-attack-witness.mjs --variant=${{ matrix.variant }} --context=${{ matrix.context }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node24
        if: ${{ always() }}
        with:
          name: attack-witness-${{ matrix.variant }}-${{ matrix.context }}-${{ github.sha }}
          path: artifacts/protocol-attack-witness/
          if-no-files-found: error
          retention-days: 14
