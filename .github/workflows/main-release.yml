name: Main stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: main-stable-release
  cancel-in-progress: false

jobs:
  prepare-and-verify:
    # The metadata commit cannot recursively bump itself, including when a
    # maintainer reruns with a token whose pushes trigger ordinary workflows.
    if: >-
      github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the current main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Configure the ephemeral GitHub credential helper and release identity
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Point only the version-commit push at the release deploy key
        # main's "Required checks" ruleset requires every PR check and lets
        # only deploy keys through; the version commit has no checks of its
        # own, and GitHub does not accept GitHub Actions as a ruleset bypass
        # actor on a personal repository. Only that push uses the key: the
        # pushurl is removed again before the tag push, which stays on the
        # workflow token so it does not start release.yml a second time.
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/release_deploy_key"
          known="$RUNNER_TEMP/github_known_hosts"
          (umask 077 && echo "$RELEASE_DEPLOY_KEY" > "$key")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$known"
          git config core.sshCommand "ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known -o StrictHostKeyChecking=yes"
          git config remote.origin.pushurl "git@github.com:$GITHUB_REPOSITORY.git"
      - name: Select semantic version and commit only release metadata
        id: prepare
        run: node tools/release-version.mjs
      - name: Return later pushes to the workflow token
        if: always()
        run: |
          git config --unset remote.origin.pushurl || true
          git config --unset core.sshCommand || true
          rm -f "$RUNNER_TEMP/release_deploy_key"
      - name: Execute every release gate on the exact versioned commit
        if: steps.prepare.outputs.skip != 'true'
        env:
          RELEASE_SHA: ${{ steps.prepare.outputs.sha }}
        run: node tools/release-gates.mjs --dispatch-main "$RELEASE_SHA"
      - name: Create a new immutable stable tag and start the release workflow
        if: steps.prepare.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
          tag="v$RELEASE_VERSION"
          existing="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          if [ -n "$existing" ]; then
            test "$existing" = "$RELEASE_SHA"
          else
            git tag "$tag" "$RELEASE_SHA"
            git push origin "refs/tags/$tag"
          fi
          # GITHUB_TOKEN pushes do not trigger another workflow: explicit dispatch.
          gh workflow run release.yml --ref "$tag" -f tag="$tag"
