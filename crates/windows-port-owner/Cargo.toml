[package]
name = "windows-port-owner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bounded read-only Windows TCP listener ownership diagnostics"

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
socket2 = "=0.6.5"
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }

# Only the reviewed Windows-only src/ffi.rs may override this deny lint.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
