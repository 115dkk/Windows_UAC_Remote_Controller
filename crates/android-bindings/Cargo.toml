[package]
name = "android-bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Generated-only ABI boundary for the headless native phone owner"

[lib]
name = "uac_android_controller"
crate-type = ["rlib", "cdylib"]

[dependencies]
activity-journal = { path = "../activity-journal" }
android-controller = { path = "../android-controller" }
phone-request-core = { path = "../phone-request-core" }
phone-state-store = { path = "../phone-state-store" }
notification-policy = { path = "../notification-policy" }
controller-runtime = { path = "../controller-runtime" }
secure-channel = { path = "../secure-channel" }
service-protocol = { path = "../service-protocol" }
serde_json.workspace = true
thiserror.workspace = true
uniffi = { version = "=0.32.0", default-features = false }

[target.'cfg(unix)'.dependencies]
# Constants for safe std no-follow opens; no libc calls or handwritten FFI.
libc = "0.2.177"

[dev-dependencies]
approval-protocol = { path = "../approval-protocol" }
framed-transport = { path = "../framed-transport" }
tempfile = "3.23.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
p256.workspace = true
secure-channel = { path = "../secure-channel" }

[lints]
workspace = true
