name: Android minified release startup

on:
  push:
    branches: [main, 'codex/native-runtime']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    name: Minified release (${{ matrix.source }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        source: [alpha4-negative-control, current]
    env:
      CI: 'true'
      ORG_GRADLE_PROJECT_controllerAbi: x86_64
    steps:
      - name: Check out current test driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - name: Check out exact product revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source == 'alpha4-negative-control' && 'v0.1.0-alpha.4' || github.sha }}
          path: product
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: product/.node-version
          package-manager-cache: false
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build inputs
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix ../control
          rustup show active-toolchain
          rustup target add x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' --channel=0 </dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build genuine minified non-debuggable release APK
        working-directory: product
        run: |
          mkdir -p ../evidence
          git rev-parse HEAD > ../evidence/product-commit.txt
          npm run tauri -- android build --target x86_64 --apk --ci
      - name: Sign disposable test APK and preserve build evidence
        shell: bash
        env:
          CASE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          mapfile -t apks < <(find product/src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*unsigned*.apk')
          [[ ${#apks[@]} -eq 1 ]]
          export CI_SIGNING_PASSWORD="$(head -c 24 /dev/urandom | base64)"
          echo "::add-mask::$CI_SIGNING_PASSWORD"
          keytool -genkeypair -keystore "$RUNNER_TEMP/startup.jks" -storepass:env CI_SIGNING_PASSWORD -keypass:env CI_SIGNING_PASSWORD -alias startup -keyalg EC -groupname secp256r1 -validity 2 -dname 'CN=Disposable CI startup only' >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p 4 "${apks[0]}" "$RUNNER_TEMP/startup-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/startup.jks" --ks-pass env:CI_SIGNING_PASSWORD --key-pass env:CI_SIGNING_PASSWORD --ks-key-alias startup --out "$RUNNER_TEMP/startup.apk" "$RUNNER_TEMP/startup-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/startup.apk" > evidence/test-signer.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$RUNNER_TEMP/startup.apk" > evidence/manifest.xml
          git -C product rev-parse HEAD > evidence/product-commit.txt
          sha256sum "$RUNNER_TEMP/startup.apk" > evidence/apk.sha256
          test -s product/src-tauri/gen/android/app/build/outputs/mapping/universalRelease/mapping.txt
          cp product/src-tauri/gen/android/app/build/outputs/mapping/universalRelease/mapping.txt evidence/r8-mapping.txt
      - name: Allow disposable emulator acceleration
        run: sudo chmod 0666 /dev/kvm
      - name: Prove unpaired release startup and actual QR entry
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          STARTUP_EXPECTATION: ${{ matrix.source }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: uac-release-startup-ci
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back emulated -camera-front emulated
          script: node control/tools/android-release-startup-ci.mjs
      - name: Retain evidence, never the ephemeral signing key or test APK
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-release-startup-${{ matrix.source }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
